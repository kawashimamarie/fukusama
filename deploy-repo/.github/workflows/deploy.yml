# 福進発展グループ3サイトの公開（デプロイ専用リポジトリ kawashimamarie/fukushin-deploy に置く）
#
# 自動：日本時間 8:05〜21:05 の毎時、fukusama の main の最新（CI 合格済み）を確かめ、変わったサイトだけを公開する。
#       自動で公開するのは、変数 AUTO_PUBLISH_SITES に入っているサイトの「承認が不要な変更」だけ。
# 手動：Actions → 「公開（福進発展3サイト）」→ Run workflow
#       mode=check（確認のみ・書き込みなし）／publish（承認して公開。confirm にドメイン名）／auto（自動と同じ判定）
#
# 本番の FTPS 情報は、deploy ジョブの「確認」「公開」の2ステップにだけ渡す。fukusama のコード（ビルド）は、
# 秘密情報のない build ジョブでだけ動く。公開の処理は、このリポジトリの deployer/（ハッシュを照合）だけ。
name: 公開（福進発展3サイト）

on:
  schedule:
    - cron: '5 23,0-12 * * *'    # UTC。日本時間 8:05〜21:05 の毎時
  workflow_dispatch:
    inputs:
      site:
        description: 対象のサイト
        type: choice
        options: [all, ebisenka, fukuki, corporate]
        default: all
      mode:
        description: check＝確認のみ（書き込みなし）／publish＝承認して公開／auto＝自動と同じ判定
        type: choice
        options: [check, publish, auto]
        default: check
      confirm:
        description: publish のときは公開するサイトのドメイン名（例 ebisenka.jp）
        type: string
        default: ''

# 公開の仕組み（deployer/SHA256SUMS）のハッシュ。ワークフローに固定しておくことで、deployer/ だけを
# 書き換えても動かない（ワークフローの変更はご本人だけ。GITHUB_TOKEN ではワークフローを変更できない）。
# fukusama の scripts/deploy_repo_sums.py が更新する
env:
  DEPLOYER_SUMS_SHA256: c40ebf82fd049f7b1c2d56e7255ce2d49e8829d37f30a9fc157d7dc5f66b226b

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read      # deploy-state ブランチの記録を読む
      actions: read       # fukusama の CI の結果を読む
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      mode: ${{ steps.r.outputs.mode }}
      sites: ${{ steps.r.outputs.sites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公開の仕組みの照合
        run: |
          echo "${DEPLOYER_SUMS_SHA256}  deployer/SHA256SUMS" | sha256sum --strict -c
          sha256sum --strict -c deployer/SHA256SUMS
      - id: r
        name: 公開するコミットとサイトを決める
        run: python3 -m deployer.gh resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_SITE: ${{ inputs.site }}
          INPUT_MODE: ${{ inputs.mode }}
          AUTO_SITES: ${{ vars.AUTO_PUBLISH_SITES }}   # 定期の確認は、ここに入っているサイトだけを処理する（空なら接続しない）

  build:
    needs: resolve
    if: needs.resolve.outputs.sites != '[]' && needs.resolve.outputs.sites != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}       # 秘密情報・書き込みの権限なし（fukusama のコードはここでだけ動く）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kawashimamarie/fukusama
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0          # 日付（各サイトを最後に変えたコミット）の判定に履歴が要る
          persist-credentials: false
      - name: ビルド
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==12.3.0
          "$RUNNER_TEMP/venv/bin/python" scripts/build_sites.py out
          test "$(python3 -c 'import json;print(json.load(open("out/build-manifest.json"))["sourceCommit"])')" = "${{ needs.resolve.outputs.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}
          path: out/
          include-hidden-files: true    # ebisenka.jp の .htaccess
          retention-days: 1             # この実行の中でだけ使う（保存容量 500MB の節約）

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false        # 1サイトの失敗で、ほかのサイトを止めない・巻き戻さない
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.sites) }}
    concurrency:
      group: deploy-${{ matrix.target.site }}   # 同じサイトの公開は同時に1つだけ（待っている古い実行は新しい実行に置き換わる）
      cancel-in-progress: false
    permissions:
      contents: write     # 最後の「記録」で deploy-state ブランチにだけ書く（FTPS を使うステップにはトークンを渡さない）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公開の仕組みの照合
        run: |
          echo "${DEPLOYER_SUMS_SHA256}  deployer/SHA256SUMS" | sha256sum --strict -c
          sha256sum --strict -c deployer/SHA256SUMS
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ github.run_id }}
          path: build/
      - name: このサイトの公開の記録を読む（deploy-state ブランチ）
        run: python3 -m deployer.gh getstate "${{ matrix.target.site }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: prepare
        name: 確認・事前バックアップ（読み取りのみ）
        run: >
          python3 -m deployer prepare --site "${{ matrix.target.site }}"
          --dist "build/${{ matrix.target.domain }}" --work work --sha "${{ needs.resolve.outputs.sha }}"
          --mode "${{ needs.resolve.outputs.mode }}" --confirm "$CONFIRM" --auto-sites "$AUTO_SITES"
          --state "state/${{ matrix.target.site }}.json" --token "${{ github.run_id }}x${{ github.run_attempt }}"
        env:
          CONFIRM: ${{ inputs.confirm }}
          AUTO_SITES: ${{ vars.AUTO_PUBLISH_SITES }}
          FTPS_EBISENKA_HOST: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_HOST || '' }}
          FTPS_EBISENKA_USER: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_USER || '' }}
          FTPS_EBISENKA_PASSWORD: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_PASSWORD || '' }}
          FTPS_EBISENKA_PARENT_ABS: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_PARENT_ABS || '' }}
          FTPS_FUKUKI_HOST: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_HOST || '' }}
          FTPS_FUKUKI_USER: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_USER || '' }}
          FTPS_FUKUKI_PASSWORD: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_PASSWORD || '' }}
          FTPS_FUKUKI_PARENT_ABS: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_PARENT_ABS || '' }}
          FTPS_CORPORATE_HOST: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_HOST || '' }}
          FTPS_CORPORATE_USER: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_USER || '' }}
          FTPS_CORPORATE_PASSWORD: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_PASSWORD || '' }}
          FTPS_CORPORATE_PARENT_ABS: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_PARENT_ABS || '' }}
      # 事前バックアップを保存し、保存先から取り出し直したものを公開に使う（保存先から戻せることを毎回確かめる）
      # 確認のみ（check）でも保存と取り出しを行い、公開の前にバックアップが保管できることを確かめる（保存は14日）
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.prepare.outcome == 'success' && (steps.prepare.outputs.decision == 'apply' || needs.resolve.outputs.mode == 'check')
        with:
          name: backup-${{ matrix.target.site }}-${{ github.run_id }}
          path: work/backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ steps.prepare.outputs.decision == 'apply' && 90 || 14 }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.prepare.outcome == 'success' && (steps.prepare.outputs.decision == 'apply' || needs.resolve.outputs.mode == 'check')
        with:
          name: backup-${{ matrix.target.site }}-${{ github.run_id }}
          path: verified-backup/
      - name: バックアップの保存と取り出しの確認（確認のみのとき・本番に接続しない）
        if: steps.prepare.outcome == 'success' && needs.resolve.outputs.mode == 'check'
        run: python3 -m deployer verify-backup --site "${{ matrix.target.site }}" --backup verified-backup --work work
      - id: head
        name: 公開するコミットが今も main の最新か（古い実行で新しい内容を上書きしない）
        if: steps.prepare.outputs.decision == 'apply'
        run: |
          head=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/kawashimamarie/fukusama/commits/main | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')
          if [ "$head" != "${{ needs.resolve.outputs.sha }}" ]; then
            echo "main が進んでいるため公開しません（次の実行で新しいコミットを公開します）" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '{"decision":"skip","status":"aborted","reason":"main が進んだため取りやめ"}' > work/decision.json
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - id: apply
        name: 公開・公開後の検証（不合格なら自動で元に戻す）
        if: steps.prepare.outputs.decision == 'apply' && steps.head.outputs.ok == 'true'
        run: >
          python3 -m deployer apply --site "${{ matrix.target.site }}"
          --dist "build/${{ matrix.target.domain }}" --work work --backup verified-backup
          --sha "${{ needs.resolve.outputs.sha }}"
        env:
          FTPS_EBISENKA_HOST: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_HOST || '' }}
          FTPS_EBISENKA_USER: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_USER || '' }}
          FTPS_EBISENKA_PASSWORD: ${{ matrix.target.prefix == 'FTPS_EBISENKA' && secrets.FTPS_EBISENKA_PASSWORD || '' }}
          FTPS_FUKUKI_HOST: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_HOST || '' }}
          FTPS_FUKUKI_USER: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_USER || '' }}
          FTPS_FUKUKI_PASSWORD: ${{ matrix.target.prefix == 'FTPS_FUKUKI' && secrets.FTPS_FUKUKI_PASSWORD || '' }}
          FTPS_CORPORATE_HOST: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_HOST || '' }}
          FTPS_CORPORATE_USER: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_USER || '' }}
          FTPS_CORPORATE_PASSWORD: ${{ matrix.target.prefix == 'FTPS_CORPORATE' && secrets.FTPS_CORPORATE_PASSWORD || '' }}
      - name: 記録（deploy-state ブランチ）と結果の状態
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          set -e
          mkdir -p "results/${{ matrix.target.site }}"
          cp work/decision.json work/result.json "results/${{ matrix.target.site }}/" 2>/dev/null || true
          git config --global user.name "fukushin-deploy"
          git config --global user.email "fukushin-deploy@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            rm -rf state-branch
            if git ls-remote --exit-code "$url" refs/heads/deploy-state >/dev/null; then
              git clone --quiet --depth 1 --branch deploy-state "$url" state-branch
            else
              git init --quiet state-branch && git -C state-branch checkout --quiet -b deploy-state
            fi
            export NOW=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')
            STATE_DIR=state-branch/state python3 -m deployer.gh record
            git -C state-branch add state
            git -C state-branch diff --cached --quiet && break
            git -C state-branch commit --quiet -m "record: ${{ matrix.target.site }} run ${GITHUB_RUN_ID}"
            git -C state-branch push --quiet "$url" HEAD:deploy-state && break
            sleep $((i * 3))   # ほかのサイトの記録と同時になったときは、取り直して再実行
          done
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          MODE: ${{ needs.resolve.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUKUSHIN_STATUS_TOKEN: ${{ secrets.FUKUSHIN_STATUS_TOKEN }}
