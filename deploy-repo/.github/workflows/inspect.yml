# 読み取り専用の調査：公開の仕組みが触れない既存ファイル（コーポレートの mail.php だけ）の PHP の不具合を、
# この実行環境の中だけで調べる（php -l の構文チェック・字句の種類の読み取り。mail.php は実行しない）。
# サーバーには書き込まない。中身は一時フォルダーに置いて調べ終えたら消し、成果物（Artifact）は作らない。
# ログと実行の要約に出すのは、エラーの種類・行番号と、ソースを含まない形の事実だけ。
name: 調査（読み取り専用）

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [corporate/mail.php]

env:
  DEPLOYER_SUMS_SHA256: cb98f1db9211b3cef9522d08c9f93b39174d2762ee4cb71a2fb9f24c8fc573ac

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公開の仕組みの照合
        run: |
          echo "${DEPLOYER_SUMS_SHA256}  deployer/SHA256SUMS" | sha256sum --strict -c
          sha256sum --strict -c deployer/SHA256SUMS
      - name: PHP の版
        run: php -v | head -n 1
      - name: 調査（読み取り専用・ソースは出さない）
        run: python3 -m deployer.inspect --site corporate --path mail.php
        env:
          FTPS_CORPORATE_HOST: ${{ secrets.FTPS_CORPORATE_HOST }}
          FTPS_CORPORATE_USER: ${{ secrets.FTPS_CORPORATE_USER }}
          FTPS_CORPORATE_PASSWORD: ${{ secrets.FTPS_CORPORATE_PASSWORD }}
